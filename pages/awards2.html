<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORBIT · The Prestige</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../variables.css">
<link rel="stylesheet" href="../components/orbit-glyphs.css">
<link rel="stylesheet" href="../components/moviecube.css">
<link rel="stylesheet" href="../components/people-cube.css">
<link rel="stylesheet" href="awards2.css">
</head>
<body>

<div class="container">

  <!-- Header -->
  <header class="awards-header">
    <a href="../index.html" class="back-nav">← BACK TO HOME</a>
    <div class="header-center">
      <h1>THE PRESTIGE</h1>
      <p class="subtitle">Every major award · Every year</p>
    </div>
    <div class="spacer"></div>
  </header>

  <!-- Hub Nav -->
  <nav class="hub-nav">
    <button class="hub-pill active" data-section="browse">Browse</button>
    <button class="hub-pill" data-section="guide">Guide</button>
    <button class="hub-pill" data-section="stats">Stats</button>
    <button class="hub-pill" data-section="stories">Stories</button>
  </nav>

  <!-- Festival Tabs -->
  <nav class="festival-tabs">
    <button class="festival-tab active" data-festival="oscar">Oscar</button>
    <button class="festival-tab" data-festival="bafta">BAFTA</button>
    <button class="festival-tab" data-festival="gg">Golden Globe</button>
    <button class="festival-tab" data-festival="cannes">Cannes</button>
    <button class="festival-tab" data-festival="venice">Venice</button>
    <button class="festival-tab" data-festival="berlin">Berlin</button>
  </nav>

  <!-- Compact Range View (default) -->
  <section id="compact-view" class="view-section">

    <!-- Featured ceremony carousel (Home C) — 4-slide marquee, JS-rendered. -->
    <div id="featured-carousel" class="featured-carousel"></div>

    <!-- Festival quick-entry rail (Home B) — colour-coded one-tap entry per
         festival. Mirrors the festival tabs' active state via switchFestival(). -->
    <nav class="festival-rail" aria-label="Jump to festival">
      <button class="fest-tile active" type="button" data-festival="oscar"><span class="og og-statuette fest-tile-glyph"></span><span class="fest-tile-name">Oscars</span></button>
      <button class="fest-tile" type="button" data-festival="bafta"><span class="og og-mask fest-tile-glyph"></span><span class="fest-tile-name">BAFTA</span></button>
      <button class="fest-tile" type="button" data-festival="gg"><span class="og og-globe fest-tile-glyph"></span><span class="fest-tile-name">Golden Globe</span></button>
      <button class="fest-tile" type="button" data-festival="cannes"><span class="og og-palm fest-tile-glyph"></span><span class="fest-tile-name">Cannes</span></button>
      <button class="fest-tile" type="button" data-festival="venice"><span class="og og-lion fest-tile-glyph"></span><span class="fest-tile-name">Venice</span></button>
      <button class="fest-tile" type="button" data-festival="berlin"><span class="og og-bear fest-tile-glyph"></span><span class="fest-tile-name">Berlin</span></button>
    </nav>

    <!-- Per-festival identity banner (JS-rendered) — glyph + accent name + descriptor.
         Rebuilt on every festival switch via renderFestivalBanner() in loadYearStrips(). -->
    <div id="festival-banner"></div>

    <div class="section-label">BROWSE BY YEAR</div>
    <div id="year-strips-container">
      <!-- Populated by JS -->
    </div>
  </section>

  <!-- Year Detail View (hidden by default) -->
  <section id="year-detail-view" class="view-section" style="display: none;">

    <!-- Sticky year header -->
    <div class="year-detail-header">
      <button class="back-to-range">← BACK TO RANGE</button>
      <div class="year-detail-title" id="year-detail-title"></div>
    </div>

    <!-- Hero container -->
    <div id="hero-container"></div>

    <!-- Trophy strip navigation (populated by renderTrophyStrip) -->
    <nav id="trophy-strip" class="trophy-strip" aria-label="Jump to award category" hidden>
      <div class="trophy-strip-lead">
        <span class="og og-trophy"></span>
        <span class="trophy-strip-lead-text">Jump to award</span>
      </div>
      <div class="trophy-carousel-wrap">
        <button id="trophy-scroll-left" class="trophy-scroll-btn left" type="button" aria-label="Previous awards">
          <span class="og og-arrow-left"></span>
        </button>
        <div id="trophy-carousel" class="trophy-carousel"><!-- populated by JS --></div>
        <button id="trophy-scroll-right" class="trophy-scroll-btn right" type="button" aria-label="Next awards">
          <span class="og og-arrow-left"></span>
        </button>
      </div>
    </nav>

    <!-- Category sections -->
    <div id="categories-container"></div>

  </section>

</div>

<script src="../config.js"></script>
<script src="../orbit-utils.js"></script>
<!-- Movie/People Cube bundle (Jun 7 2026): standard set used by anchor-point,
     home, actor-timeline, awards-browse. Cubes self-inject their DOM and
     auto-load orbit-close + award-badges; awards2.js calls initMovieCube/
     initPeopleCube once on DOMContentLoaded. -->
<script src="../utils.js"></script>
<script src="../components/shortlist-service.js"></script>
<script src="../components/encounter-service.js"></script>
<script src="../components/trivia-stats.js"></script>
<script src="../components/moviecube.js"></script>
<script src="../components/people-cube.js"></script>
<script src="awards2.js"></script>
</body>
</html>
